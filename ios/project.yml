name: Generalizable
options:
  bundleIdPrefix: dev.patliu
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: "NO"
    MTL_LANGUAGE_REVISION: Metal30
targets:
  Generalizable:
    type: application
    platform: iOS
    sources:
      - path: Generalizable
        excludes: ["Resources/Cases/**"]
      - path: Generalizable/Resources/Cases
        type: folder
        buildPhase: resources
    info:
      path: Generalizable/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Generalizable
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.patliu.generalizable
  GeneralizableTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GeneralizableTests]
    dependencies:
      - target: Generalizable
